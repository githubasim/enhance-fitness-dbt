version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: dim_club
    columns:
      - name: club_id
        data_tests: [unique, not_null]

  - name: dim_trainer
    columns:
      - name: trainer_id
        data_tests: [unique, not_null]
      - name: club_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_club'), field: club_id}

  - name: dim_package_type
    columns:
      - name: package_type_id
        data_tests: [unique, not_null]

  - name: dim_client
    columns:
      - name: client_id
        data_tests: [unique, not_null]
      - name: home_club_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_club'), field: club_id}

  - name: fct_sessions
    description: >
      One row per session. Revenue is recognised for delivered and no-show sessions,
      commission on delivered only. Sessions scheduled before the trainer's hire date
      are kept and flagged with is_before_trainer_hire.
    columns:
      - name: session_id
        data_tests: [unique, not_null]
      - name: client_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_client'), field: client_id}
      - name: trainer_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_trainer'), field: trainer_id}
      - name: club_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_club'), field: club_id}
      - name: package_type_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_package_type'), field: package_type_id}
      - name: session_date_key
        data_tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}

  - name: fct_packages
    description: >
      One row per package purchase, with discount, refund status, session outcomes
      and the revenue, commission and margin rolled up from fct_sessions logic.
    columns:
      - name: purchase_id
        data_tests: [unique, not_null]
      - name: client_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_client'), field: client_id}
      - name: package_type_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_package_type'), field: package_type_id}
      - name: purchase_date_key
        data_tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
  - name: mart_trainer_utilisation_monthly
    description: >
      One row per trainer per full month since hire. Utilisation = delivered hours
      divided by available hours (weekly availability x 52 / 12). Idle hours exclude
      no-show slots. The current partial month is excluded.
    columns:
      - name: trainer_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_trainer'), field: trainer_id}
      - name: utilisation_pct
        data_tests: [not_null]
  - name: mart_client_retention_cohorts
    description: >
      Retention by first-purchase cohort. A client is active in a month if they had
      at least one delivered session. The current partial month is excluded.
    columns:
      - name: cohort_month
        data_tests: [not_null]
      - name: retention_pct
        data_tests: [not_null]

  - name: mart_renewal_by_package_type
    description: >
      Share of matured packages followed by another purchase by the same client.
      Matured means purchase date plus 110 percent of validity is in the past.
    columns:
      - name: package_type_id
        data_tests: [unique, not_null]
      - name: renewal_rate
        data_tests: [not_null]
  - name: mart_package_pricing
    description: >
      One row per package type and discount band. Per-session metrics exclude refunded
      packages and use consumed sessions (delivered plus no-show) so recent purchases
      do not distort them. Commission is calculated on net price.
    columns:
      - name: package_type_id
        data_tests: [not_null]
      - name: discount_band_pct
        data_tests:
          - accepted_values:
              arguments: {values: [0, 5, 10, 15, 20], quote: false}

  - name: mart_trainer_economics
    description: >
      One row per trainer with recognised revenue, commission and margin, ranked within
      club. Refunded packages are excluded. sessions_before_hire shows how many sessions
      fall before the hire date.
    columns:
      - name: trainer_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments: {to: ref('dim_trainer'), field: trainer_id}
  - name: mart_rebooking_rate
    description: >
      One row per club and month. Rebooking rate is the share of delivered sessions,
      at least 14 days old, followed by another non-cancelled session from the same
      client within 14 days. Cancelled sessions are ignored when looking for the next session.
    columns:
      - name: club_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_club'), field: club_id}
      - name: rebooking_rate_14d
        data_tests: [not_null]